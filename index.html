<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vantrel &#x2014; Compare True Wireless Earbuds</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231C1916'/%3E%3Ctext x='16' y='22' font-family='Helvetica,Arial' font-size='17' font-weight='600' fill='%23fff' text-anchor='middle'%3EV%3C/text%3E%3C/svg%3E">
<style>
:root{
  --n-0:#FFFFFF;  --n-25:#FBFAF8; --n-50:#F5F2EE; --n-100:#EDE9E4; --n-200:#E1DCD5;
  --n-300:#C8C2B9; --n-400:#A39C92; --n-500:#7E776D; --n-600:#635C53; --n-700:#474139;
  --n-800:#2E2A25; --n-900:#1C1916; --n-950:#100E0C;
  --a-50:#EEF3F8; --a-300:#A9C0D8; --a-500:#2E6BA8; --a-600:#1F5691; --a-700:#17436F; --a-800:#11324F;
  --c-error:#8E2116; --c-error-bg:#FBF3F2;
  --mark-keep:#146B3F; --mark-remove:#A32718;
  --font-sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI","Helvetica Neue",Arial,sans-serif;
  --font-mono:ui-monospace,"SFMono-Regular","SF Mono",Menlo,Consolas,"Liberation Mono",monospace;
  --fw-regular:400; --fw-medium:500; --fw-semibold:600;
  --t-micro-size:11px;   --t-micro-lh:16px;   --t-micro-ls:.04em;
  --t-caption-size:12px; --t-caption-lh:16px; --t-caption-ls:.01em;
  --t-meta-size:13px;    --t-meta-lh:20px;
  --t-ui-size:15px;      --t-ui-lh:20px;
  --t-body-size:15px;    --t-body-lh:22px;
  --t-prose-size:16px;   --t-prose-lh:26px;
  --t-lead-size:18px;    --t-lead-lh:26px;    --t-lead-ls:-.005em;
  --t-price-size:20px;   --t-price-lh:28px;   --t-price-ls:-.01em;
  --t-h2-size:22px;      --t-h2-lh:30px;      --t-h2-ls:-.012em;
  --t-h1-size:28px;      --t-h1-lh:36px;      --t-h1-ls:-.018em;
  --t-mark-size:20px;    --t-mark-lh:24px;    --t-mark-ls:.18em;
  --sp-4:4px; --sp-8:8px; --sp-12:12px; --sp-16:16px; --sp-20:20px; --sp-24:24px;
  --sp-28:28px; --sp-32:32px; --sp-40:40px; --sp-48:48px; --sp-56:56px;
  --shell-store:980px; --shell-instr:720px; --gutter:24px; --col-card:478px;
  --r-2:2px; --r-4:4px; --r-6:6px; --r-8:8px; --r-10:10px; --r-full:999px;
  --shadow-1:0 1px 2px rgba(28,25,22,.06),0 1px 1px rgba(28,25,22,.04);
  --shadow-2:0 2px 6px rgba(28,25,22,.07),0 1px 2px rgba(28,25,22,.05);
  --shadow-3:0 8px 24px rgba(28,25,22,.10),0 2px 6px rgba(28,25,22,.06);
  --shadow-inset-press:inset 0 1px 2px rgba(17,50,79,.30);
  --focus-ring:0 0 0 2px var(--n-0),0 0 0 5px var(--a-600);
  --focus-ring-dark:0 0 0 2px var(--n-0),0 0 0 5px var(--n-900);
  --dur-press:90ms; --dur-hover:140ms; --dur-screen:220ms;
  --ease-standard:cubic-bezier(.2,0,.38,1);
}
@media (prefers-reduced-motion: reduce){
  :root{--dur-press:1ms;--dur-hover:1ms;--dur-screen:1ms;}
  *{animation-duration:1ms !important;transition-duration:1ms !important;}
  .btn-decide:active{transform:none !important;}
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-sans); background:var(--n-50); color:var(--n-900);
  font-size:var(--t-body-size); line-height:var(--t-body-lh);
  -webkit-font-smoothing:antialiased; font-feature-settings:"kern" 1;
}
h1,h2,h3{margin:0;}
a{color:var(--a-600);}
:focus-visible{outline:none;box-shadow:var(--focus-ring);border-radius:var(--r-4);}
.tnum{font-variant-numeric:tabular-nums lining-nums;}
.vh{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;
    clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.skip{position:absolute;left:16px;top:-60px;z-index:99;background:var(--a-600);color:#fff;
      padding:0 18px;height:44px;line-height:44px;border-radius:var(--r-6);font-weight:var(--fw-semibold);
      text-decoration:none;transition:top var(--dur-hover) var(--ease-standard);}
.skip:focus{top:8px;}
.fade-in{animation:fadeIn 400ms var(--ease-standard);}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}

/* ============================ STORE FAMILY ============================ */
#store{display:none;}
.announce{background:var(--n-800);color:var(--n-0);height:34px;display:flex;align-items:center;
  justify-content:center;font-size:var(--t-caption-size);line-height:var(--t-caption-lh);
  letter-spacing:var(--t-caption-ls);border-radius:0;}
.shell{max-width:calc(var(--shell-store) + 48px);margin-inline:auto;padding-inline:24px;}
.hdr{background:var(--n-0);border-bottom:1px solid var(--n-200);height:64px;display:flex;align-items:center;}
.hdr-in{display:grid;grid-template-columns:auto 1fr auto;column-gap:40px;align-items:center;width:100%;}
.wordmark{font-size:var(--t-mark-size);line-height:var(--t-mark-lh);letter-spacing:var(--t-mark-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);text-transform:uppercase;margin-right:-.18em;
  text-decoration:none;}
.nav{display:flex;column-gap:28px;list-style:none;margin:0;padding:0;}
.nav a{font-size:var(--t-meta-size);line-height:var(--t-meta-lh);font-weight:var(--fw-medium);
  color:var(--n-700);text-decoration:none;transition:color var(--dur-hover) var(--ease-standard);}
.nav a:hover{color:var(--n-900);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:1px;}
.util{display:flex;align-items:center;}
.util button{width:44px;height:44px;border:0;background:transparent;border-radius:var(--r-6);
  cursor:pointer;color:var(--n-700);display:grid;place-items:center;position:relative;}
.util button:hover{background:var(--n-50);}
.cart-badge{position:absolute;top:5px;right:4px;width:18px;height:18px;border-radius:var(--r-full);
  background:var(--a-50);color:var(--a-800);font-size:var(--t-micro-size);line-height:18px;
  text-align:center;font-weight:var(--fw-semibold);}
.crumb{padding-block:14px;font-size:var(--t-meta-size);line-height:var(--t-meta-lh);}
.crumb ol{list-style:none;margin:0;padding:0;display:flex;}
.crumb a{color:var(--a-700);text-decoration:none;}
.crumb a:hover{text-decoration:underline;text-underline-offset:2px;}
.crumb .sep{color:var(--n-600);margin-inline:8px;}
.crumb [aria-current]{color:var(--n-700);font-weight:var(--fw-medium);}
.store-h1{font-size:var(--t-h1-size);line-height:var(--t-h1-lh);letter-spacing:var(--t-h1-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);}
.store-sub{font-size:var(--t-body-size);line-height:24px;color:var(--n-700);max-width:640px;margin-top:8px;}

.verdict{background:var(--n-0);border:1px solid var(--n-300);border-radius:var(--r-10);
  box-shadow:var(--shadow-2);padding:40px 44px;display:grid;grid-template-columns:1fr 260px;column-gap:48px;}
.vpill{display:inline-block;background:var(--n-900);color:var(--n-0);border-radius:var(--r-full);
  padding:7px 18px;font-size:var(--t-caption-size);line-height:16px;font-weight:var(--fw-semibold);
  letter-spacing:.14em;}
.vhead{font-size:34px;line-height:44px;letter-spacing:-.018em;font-weight:var(--fw-semibold);
  color:var(--n-900);margin:20px 0 0;max-width:620px;}
.vsub{font-size:var(--t-prose-size);line-height:var(--t-prose-lh);color:var(--n-700);
  margin:16px 0 0;max-width:600px;}
.vfoot{font-size:var(--t-caption-size);line-height:16px;color:var(--n-600);margin:22px 0 0;}
.vstrip{background:var(--n-100);border:1px solid var(--n-200);border-radius:var(--r-8);
  padding:16px 22px;display:flex;align-items:center;column-gap:18px;}
.vstrip .vpill{background:var(--n-800);flex:0 0 auto;}
.vstrip .vs-head{font-size:var(--t-lead-size);line-height:26px;font-weight:var(--fw-semibold);
  color:var(--n-900);flex:1 1 auto;}
.vstrip .vs-meta{font-size:var(--t-caption-size);line-height:16px;color:var(--n-600);
  text-align:right;flex:0 0 auto;font-variant-numeric:tabular-nums;}
.labband{height:206px;background:var(--n-100);border:1px solid var(--n-200);border-radius:var(--r-8);
  padding:24px 32px;display:grid;grid-template-columns:1fr 256px;column-gap:40px;}
.labband .eyebrow{font-size:var(--t-caption-size);line-height:16px;font-weight:var(--fw-semibold);
  letter-spacing:.09em;text-transform:uppercase;color:var(--n-600);}
.labband .body{font-size:var(--t-prose-size);line-height:var(--t-prose-lh);color:var(--n-900);
  max-width:620px;margin-top:10px;font-weight:var(--fw-regular);}
.labband .fn{font-size:var(--t-caption-size);line-height:16px;color:var(--n-700);margin-top:12px;}
.labband .fn a{color:var(--a-700);}
.labmeta{display:grid;grid-template-columns:84px 1fr;row-gap:8px;column-gap:12px;align-content:start;}
.labmeta dt{font-size:var(--t-caption-size);line-height:16px;color:var(--n-600);margin:0;}
.labmeta dd{font-size:var(--t-caption-size);line-height:16px;font-weight:var(--fw-medium);
  color:var(--n-900);margin:0;font-variant-numeric:tabular-nums;}

.instr-line{font-size:var(--t-body-size);line-height:24px;color:var(--n-700);}
.pcard{position:relative;}
.mark{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%) scale(.55);
  width:120px;height:120px;border-radius:var(--r-full);display:grid;place-items:center;
  background:rgba(255,255,255,.95);box-shadow:var(--shadow-3);opacity:0;pointer-events:none;
  transition:opacity 200ms var(--ease-standard),transform 200ms var(--ease-standard);z-index:3;}
.pcard.acted .mark{opacity:1;transform:translate(-50%,-50%) scale(1);}
.mark svg{width:60px;height:60px;}
.mark .mlab{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);white-space:nowrap;
  font-size:var(--t-meta-size);line-height:20px;font-weight:var(--fw-semibold);letter-spacing:.02em;}
.mark.keep{color:var(--mark-keep);} .mark.remove{color:var(--mark-remove);}
.pcard.dimmed::after{content:"";position:absolute;inset:0;border-radius:var(--r-8);z-index:2;
  pointer-events:none;background:rgba(245,242,238,.72);animation:veil 260ms var(--ease-standard);}
@keyframes veil{from{opacity:0}to{opacity:1}}
.pcard.dimmed .pname{text-decoration:line-through;color:var(--n-600);}
.compare{display:grid;grid-template-columns:1fr 1fr;column-gap:var(--gutter);align-items:stretch;position:relative;}
.pcard{background:var(--n-0);border:1px solid var(--n-300);border-radius:var(--r-8);
  box-shadow:var(--shadow-1);padding:24px 28px;display:flex;flex-direction:column;}
.pwell{height:220px;background:var(--n-50);border-radius:var(--r-6);padding:12px 12px 16px;
  display:grid;place-items:center;}
.pwell svg{width:100%;height:100%;}
.psku{font-family:var(--font-mono);font-size:var(--t-micro-size);line-height:16px;
  letter-spacing:var(--t-micro-ls);text-transform:uppercase;color:var(--n-600);margin-top:16px;}
.pname{font-size:var(--t-lead-size);line-height:var(--t-lead-lh);letter-spacing:var(--t-lead-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);white-space:nowrap;margin-top:6px;}
.pway{font-size:var(--t-meta-size);line-height:20px;color:var(--n-600);margin-top:2px;}
.pprice{font-size:var(--t-price-size);line-height:var(--t-price-lh);letter-spacing:var(--t-price-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);margin-top:10px;font-variant-numeric:tabular-nums;}
.pdesc{font-size:var(--t-body-size);line-height:22px;color:var(--n-700);margin-top:16px;height:44px;}
.pdiv{border-top:1px solid var(--n-200);margin-top:20px;}
.specs{margin:20px 0 0;padding:0;}
.specrow{height:44px;display:grid;grid-template-columns:1fr 164px 8px 40px;align-items:center;
  border-bottom:1px solid var(--n-200);}
.specrow:last-child{border-bottom:none;}
.specrow dt{font-size:var(--t-meta-size);line-height:20px;font-weight:var(--fw-medium);
  color:var(--n-600);white-space:nowrap;margin:0;}
.specrow dd{margin:0;font-size:var(--t-ui-size);line-height:20px;color:var(--n-900);
  font-variant-numeric:tabular-nums lining-nums;white-space:nowrap;}
.specrow dd.num{text-align:right;}
.specrow dd.unit{text-align:left;color:var(--n-600);grid-column:4;}
.specrow dd.wide{grid-column:2 / span 3;text-align:right;}
.specrow.differs dd{font-weight:var(--fw-semibold);letter-spacing:-.006em;}
#rails{position:absolute;inset:0;pointer-events:none;}
.rail{position:absolute;width:var(--gutter);height:1px;background:var(--n-300);}
.btn-wrap{margin-top:auto;padding-top:20px;}
.btn-decide{width:100%;height:48px;border-radius:var(--r-6);border:1px solid transparent;
  background:var(--a-600);color:var(--n-0);font-size:var(--t-ui-size);line-height:var(--t-ui-lh);
  font-weight:var(--fw-semibold);letter-spacing:.005em;cursor:pointer;box-shadow:var(--shadow-1);
  transition:background-color var(--dur-hover) var(--ease-standard),
             box-shadow var(--dur-press) var(--ease-standard),
             transform var(--dur-press) var(--ease-standard);}
.btn-decide span{display:inline-block;padding-top:1px;}
.btn-decide:hover:not(:disabled){background:var(--a-700);}
.btn-decide:active:not(:disabled){background:var(--a-800);transform:translateY(1px);box-shadow:var(--shadow-inset-press);}
.btn-decide:focus-visible{box-shadow:var(--focus-ring);}
.btn-decide:disabled,.btn-decide[aria-disabled="true"]{background:var(--n-100);color:var(--n-600);
  border-color:var(--n-400);cursor:not-allowed;box-shadow:none;transform:none;}
.undergrid{font-size:var(--t-meta-size);line-height:20px;color:var(--n-600);text-align:center;}
.ftr{background:var(--n-800);padding:48px 0 40px;margin-top:56px;}
.ftr-cols{display:grid;grid-template-columns:repeat(4,1fr);column-gap:32px;}
.ftr h3{font-size:var(--t-caption-size);line-height:16px;font-weight:var(--fw-semibold);
  letter-spacing:.08em;text-transform:uppercase;color:var(--n-0);margin-bottom:16px;}
.ftr ul{list-style:none;margin:0;padding:0;}
.ftr a{font-size:var(--t-meta-size);line-height:28px;color:var(--n-200);text-decoration:none;}
.ftr a:hover{color:var(--n-0);text-decoration:underline;}
.ftr-legal{margin-top:40px;padding-top:20px;border-top:1px solid rgba(255,255,255,.10);
  font-size:var(--t-caption-size);line-height:16px;color:var(--n-400);}
.actbar{display:flex;align-items:flex-start;column-gap:16px;background:var(--n-0);
  border:1px solid var(--n-300);border-left-width:4px;border-radius:var(--r-8);
  box-shadow:var(--shadow-1);padding:20px 24px;}
.actbar.keep{border-left-color:var(--mark-keep);}
.actbar.remove{border-left-color:var(--mark-remove);}
.actglyph{flex:0 0 auto;width:40px;height:40px;display:grid;place-items:center;}
.actglyph svg{width:32px;height:32px;}
.actbar.keep .actglyph{color:var(--mark-keep);}
.actbar.remove .actglyph{color:var(--mark-remove);}
.acthead{display:block;font-size:var(--t-h2-size);line-height:30px;letter-spacing:var(--t-h2-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);}
.actsub{display:block;font-size:var(--t-body-size);line-height:22px;color:var(--n-700);margin-top:4px;}
.recap-mark{flex:0 0 auto;width:30px;height:30px;border-radius:var(--r-full);display:grid;
  place-items:center;border:1.5px solid currentColor;}
.recap-mark svg{width:18px;height:18px;}
.recap-mark.keep{color:var(--mark-keep);background:rgba(20,107,63,.09);}
.recap-mark.remove{color:var(--mark-remove);background:rgba(163,39,24,.09);}
.cartline{display:grid;grid-template-columns:120px 1fr auto;align-items:center;column-gap:20px;
  padding:20px 0;border-bottom:1px solid var(--n-200);}
.cartline:last-of-type{border-bottom:none;}
.cartline .thumb{height:80px;background:var(--n-50);border-radius:var(--r-6);display:grid;place-items:center;}
.cartline .thumb svg{width:100%;height:76px;}
.cartline.out{opacity:.45;}
.cartline.out .cname{text-decoration:line-through;}
.cname{font-size:var(--t-lead-size);line-height:var(--t-lead-lh);font-weight:var(--fw-semibold);}
.ctag{font-size:var(--t-meta-size);line-height:20px;color:var(--n-600);margin-top:2px;}

/* ========================= INSTRUMENT FAMILY ========================= */
#instr{display:none;}
.ibar{background:var(--n-0);border-bottom:1px solid var(--n-200);height:56px;display:flex;align-items:center;}
.ibar-in{max-width:calc(var(--shell-instr) + 48px);margin-inline:auto;padding-inline:24px;width:100%;
  display:flex;align-items:center;justify-content:space-between;}
.ibrand{font-size:var(--t-meta-size);line-height:20px;font-weight:var(--fw-medium);color:var(--n-700);}
.prog-wrap{display:flex;align-items:center;column-gap:12px;}
.prog-cap{font-size:var(--t-meta-size);line-height:20px;color:var(--n-600);font-variant-numeric:tabular-nums;}
.prog{width:320px;height:6px;background:var(--n-200);border-radius:var(--r-full);overflow:hidden;}
.prog>div{height:100%;width:0;background:var(--n-800);border-radius:var(--r-full);
  transition:width var(--dur-screen) var(--ease-standard);}
.icard-wrap{max-width:calc(var(--shell-instr) + 48px);margin-inline:auto;padding-inline:24px;padding-bottom:64px;}
.icard{background:var(--n-0);border:1px solid var(--n-200);border-radius:var(--r-10);
  box-shadow:var(--shadow-1);padding:40px 36px;margin-top:40px;}
.icard h1{font-size:var(--t-h2-size);line-height:var(--t-h2-lh);letter-spacing:var(--t-h2-ls);
  font-weight:var(--fw-semibold);color:var(--n-900);}
.icard h1:focus{outline:none;}
.stem{font-size:var(--t-prose-size);line-height:var(--t-prose-lh);font-weight:var(--fw-medium);
  color:var(--n-900);max-width:560px;}
.helper{font-size:var(--t-meta-size);line-height:20px;color:var(--n-600);margin-top:8px;}
.qlab{font-size:var(--t-body-size);line-height:22px;font-weight:var(--fw-semibold);color:var(--n-900);margin:0 0 12px;}
.cards{display:grid;gap:10px;}
.pcardopt{display:flex;flex-direction:column;align-items:center;justify-content:center;row-gap:8px;
  min-height:96px;padding:14px 8px;border:1px solid var(--n-300);border-radius:var(--r-8);cursor:pointer;
  background:var(--n-0);text-align:center;position:relative;
  transition:background-color var(--dur-hover) var(--ease-standard),border-color var(--dur-hover) var(--ease-standard);}
.pcardopt:hover{background:var(--n-25);border-color:var(--n-500);}
.pcardopt:has(input:checked){background:var(--n-100);border-color:var(--n-900);box-shadow:inset 0 0 0 1px var(--n-900);}
.pcardopt input{position:absolute;opacity:0;width:0;height:0;}
.pcardopt input:focus-visible + .ico{box-shadow:var(--focus-ring-dark);border-radius:var(--r-4);}
.pcardopt .ico{color:var(--n-700);display:grid;place-items:center;}
.pcardopt .ico svg{width:26px;height:26px;}
.pcardopt:has(input:checked) .ico{color:var(--n-900);}
.clab{font-size:var(--t-meta-size);line-height:17px;color:var(--n-700);}
.pcardopt:has(input:checked) .clab{color:var(--n-900);font-weight:var(--fw-medium);}
.recap{background:var(--n-50);border:1px solid var(--n-200);border-radius:var(--r-6);
  padding:12px 16px;font-size:var(--t-meta-size);line-height:20px;color:var(--n-700);margin-bottom:24px;}
.blk{margin-top:28px;}
.idiv{border-top:1px solid var(--n-200);margin-top:28px;}
.icta-row{margin-top:36px;display:flex;justify-content:flex-end;}
.btn-cta{height:48px;min-width:160px;padding-inline:28px;border-radius:var(--r-6);border:1px solid transparent;
  background:var(--n-800);color:var(--n-0);font-size:var(--t-ui-size);font-weight:var(--fw-semibold);
  cursor:pointer;transition:background-color var(--dur-hover) var(--ease-standard);}

  var WA2_BR = "M45.1,2C44.28,31.5 26.24,51.5 -1.64,51.5";
  var WA_PLATE = "M-0.94,-43.67C24.02,-42.11 41.18,-26.9 40.4,-1.94C39.62,21.07 22.46,36.67 -4.06,36.67C-27.46,36.67 -45.4,20.29 -45.4,-5.06C-45.4,-27.68 -25.9,-42.11 -0.94,-43.67Z";

/* ------------------------------- transport ------------------------------ */
function sbHeaders(extra){
  return Object.assign({ apikey:CONFIG.key, Authorization:"Bearer "+CONFIG.key,
                         "Content-Type":"application/json" }, extra||{});
}
function sbInsert(table,row){
  if(OFFLINE){ console.log("[OFFLINE "+table+"]",row); return Promise.resolve({ok:true,offline:true}); }
  return fetch(CONFIG.endpoint+"/rest/v1/"+table,{
    method:"POST", headers:sbHeaders({Prefer:"return=minimal"}), body:JSON.stringify([row])
  }).then(r=>({ok:r.ok||r.status===409, dup:r.status===409, status:r.status}));
}
function logEvent(event,detail){
  const det = detail ? JSON.stringify(detail).slice(0,500) : "";
  sbInsert(CONFIG.tbl.events,{ study:CONFIG.studyName, version:CONFIG.version,
    pid:D.pid, submission_id:D.submission_id, event:event, detail:det }).catch(()=>{});
}
function cellKey(c){ return c.act+"__"+c.domain; }
function allCells(){
  const out=[];
  for(const a of CONFIG.factors.act) for(const d of CONFIG.factors.domain) out.push({act:a,domain:d});
  return out;
}
async function assignCondition(){
  const ck="st_cond_"+CONFIG.studyName;
  const cached=localStorage.getItem(ck);
  if(cached){ applyCondition(JSON.parse(cached),"cached"); return; }
  let cond=null, source="client_fallback";
  if(CONFIG.assignment==="server" && !OFFLINE){
    try{
      const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
      const r=await fetch(CONFIG.endpoint+"/rest/v1/rpc/"+CONFIG.tbl.rpc,{
        method:"POST", headers:sbHeaders(), signal:ctl.signal,
        body:JSON.stringify({ p_study:CONFIG.studyName, p_submission_id:D.submission_id,
                              p_pid:D.pid, p_cells:allCells().map(cellKey) })
      });
      clearTimeout(to);
      if(r.ok){
        const cs=await r.json();
        if(typeof cs==="string" && cs.indexOf("__")>0){
          const [a,d]=cs.split("__");
          if(CONFIG.factors.act.includes(a) && CONFIG.factors.domain.includes(d)){
            cond={act:a,domain:d}; source="server_balanced";
          }
        }
      }
    }catch(e){}
  }
  if(!cond){ cond=allCells()[Math.floor(Math.random()*4)]; if(OFFLINE) source="client_offline"; }
  try{ localStorage.setItem(ck,JSON.stringify(cond)); }catch(e){}
  applyCondition(cond,source);
  if(source!=="server_balanced") logEvent("assign",{cell:cellKey(cond),source:source});
}
function applyCondition(cond,source){
  D.condition=cond; D.cond_act=cond.act; D.cond_domain=cond.domain;
  D.cond_cell=cellKey(cond); D.assignment_source=source;
  D.ts_assigned=new Date().toISOString();
  buildStimulus();
}
let SUBMITTED=false;
async function submitData(){
  D.ts_end=new Date().toISOString();
  D.duration_s=Math.round((Date.now()-START_MS)/1000);
  D.flag_fast=D.duration_s < CONFIG.minMinutes*60*0.4 ? 1 : 0;
  D.status="complete";
  const row={}; Object.keys(D).forEach(k=>{ if(k!=="condition") row[k]=D[k]; });
  for(let att=1;att<=3;att++){
    try{
      logEvent("submit_attempt",{n:att});
      const r=await sbInsert(CONFIG.tbl.responses,{
        submission_id:D.submission_id, pid:D.pid, status:row.status,
        duration_s:row.duration_s, data:row });
      if(r&&r.ok){ SUBMITTED=true; logEvent("submit_ok"); return true; }
      throw new Error("status "+(r&&r.status));
    }catch(e){
      if(att===3){ logEvent("submit_fail",{err:String(e).slice(0,200)}); return false; }
      await new Promise(res=>setTimeout(res, att===1?1000:3000));
    }
  }
}
addEventListener("pagehide",()=>{

/* ---- realized stimulus for this participant (built at assignment) ---- */
const S = {};
function buildStimulus(){
  const nameFirst       = pick2();   // which product name carries which profile
  const leftIsFirstName = pick2();   // which name sits on the left
  const rowOrder        = pick2();   // which block of spec rows is read first

  const model = [0,1].map(i=>{
    const pIdx = nameFirst === 0 ? i : 1-i;
    return { name:NAMES[i], short:SHORT[i], sku:SKUS[i],
             render:MODEL_PROFILES[pIdx].render, palette:MODEL_PROFILES[pIdx].palette,
             specs:MODEL_PROFILES[pIdx].specs, profile:pIdx };
  });

  S.dom = D.cond_domain;
  S.model = model;
  S.leftIdx  = leftIsFirstName ? 0 : 1;
  S.rightIdx = leftIsFirstName ? 1 : 0;
  S.rowKeys  = rowOrder ? ROW_ORDER_B : ROW_ORDER_A;
  S.differs  = DIFFER_KEYS;

  D.cb_name_map     = nameFirst ? "sela_profile1" : "nord_profile1";
  D.cb_side         = S.leftIdx === 0 ? "nord_left" : "sela_left";
  D.cb_rowgroup     = rowOrder ? "measured_first" : "qualitative_first";
  D.cb_dominant     = "na";          // no dominant option exists by design
  D.cb_mirror       = "na";
  D.stim_left_name  = model[S.leftIdx].name;
  D.stim_right_name = model[S.rightIdx].name;
}

const FAV9 = { lo:"Very unfavourable", mid:"Neither favourable nor unfavourable", hi:"Very favourable",
  sr:{1:"Very unfavourable",2:"Unfavourable",3:"Somewhat unfavourable",4:"Slightly unfavourable",
      5:"Neither favourable nor unfavourable",6:"Slightly favourable",7:"Somewhat favourable",
      8:"Favourable",9:"Very favourable"} };
const AG9 = { lo:"Strongly disagree", mid:"Neither agree nor disagree", hi:"Strongly agree",
  sr:{1:"Strongly disagree",2:"Disagree",3:"Somewhat disagree",4:"Slightly disagree",5:"Neither agree nor disagree",
      6:"Slightly agree",7:"Somewhat agree",8:"Agree",9:"Strongly agree"} };

let BLOCKS = [];   // validators/savers registered by the current screen
function resetBlocks(){ BLOCKS = []; }

/** 9-point agreement matrix. items:[{code,text,correct?}] */
function grid9(name, prompt, items, opts){
  opts = opts || {};
  const anchors = opts.anchors || AG9;
  const order = opts.shuffle === false ? items.slice() : shuf(items);
  let h = '<div class="blk">';
  if (prompt) h += '<p class="stem">'+esc(prompt)+'</p>';
  if (opts.helper) h += '<p class="helper">'+esc(opts.helper)+'</p>';
  h += '<table class="grid9"><colgroup><col class="lab">'+
       Array(9).fill('<col>').join("")+'</colgroup><thead><tr><th></th>';
  for(let i=1;i<=9;i++)
    h += '<th class="pt" scope="col"><b>'+i+'</b><span class="vh">'+esc(anchors.sr[i]||String(i))+'</span></th>';
  h += '</tr><tr class="anchrow" aria-hidden="true"><td></td>'+
       '<td colspan="3" class="a-lo">'+esc(anchors.lo)+'</td>'+
       '<td colspan="3" class="a-mid">'+esc(anchors.mid)+'</td>'+
       '<td colspan="3" class="a-hi">'+esc(anchors.hi)+'</td></tr></thead><tbody>';
  for(const it of order){
    h += '<tr role="radiogroup" aria-labelledby="lbl-'+it.code+'">'+
         '<td class="itm" id="lbl-'+it.code+'">'+esc(it.text)+'</td>';
    for(let v=1;v<=9;v++)
      h += '<td class="cell"><label><input type="radio" name="'+it.code+'" value="'+v+'">'+
           '<span class="vh">'+esc(it.text)+' \u2014 '+v+', '+esc(anchors.sr[v]||"")+'</span></label></td>';
    h += '</tr>';
  }
  h += '</tbody></table></div>';
  BLOCKS.push({
    validate(){ for(const it of order) if(!$('input[name="'+it.code+'"]:checked')) return "Please answer every row before continuing."; return null; },
    save(){
      D[name+"_order"] = order.map(i=>i.code).join(",");
      for(const it of order){
        const v = parseInt($('input[name="'+it.code+'"]:checked').value,10);
        D[it.code] = v;
        if(typeof it.correct === "number") D[it.code+"_pass"] = (v===it.correct)?1:0;
      }
    }
  });
  return h;
}

/** single 9-point row with its own endpoint labels */
function single9(code, prompt, lo, mid, hi, helper){
  let h = '<div class="blk"><p class="stem" id="lbl-'+code+'">'+esc(prompt)+'</p>';
  if(helper) h += '<p class="helper">'+esc(helper)+'</p>';
  h += '<div class="single"><div class="row" role="radiogroup" aria-labelledby="lbl-'+code+'">';
  for(let v=1;v<=9;v++)
    h += '<label><input type="radio" name="'+code+'" value="'+v+'">'+
         '<span aria-hidden="true">'+v+'</span><span class="vh">'+v+' of 9</span></label>';
  h += '</div><div class="ends"><span>'+esc(lo)+'</span>'+
       (mid?'<span class="mid">'+esc(mid)+'</span>':'')+'<span>'+esc(hi)+'</span></div></div></div>';
  BLOCKS.push({
    validate(){ return $('input[name="'+code+'"]:checked') ? null : "Please choose a point on the scale."; },
    save(){ D[code] = parseInt($('input[name="'+code+'"]:checked').value,10); }
  });
  return h;
}

/** radio list; options are shuffled only when shuffle:true */
function radioList(code, prompt, options, opts){
  opts = opts || {};
  const order = opts.shuffle ? shuf(options.map((o,i)=>({o:o,i:i}))) : options.map((o,i)=>({o:o,i:i}));
  let h = '<div class="blk"><p class="stem" id="lbl-'+code+'">'+esc(prompt)+'</p>';
  if(opts.helper) h += '<p class="helper">'+esc(opts.helper)+'</p>';
  h += '<div class="choices" role="radiogroup" aria-labelledby="lbl-'+code+'">';
  for(const it of order)
    h += '<label><input type="radio" name="'+code+'" value="'+esc(it.o.v)+'"><span>'+esc(it.o.t)+'</span></label>';
  h += '</div></div>';
  BLOCKS.push({
    validate(){ return $('input[name="'+code+'"]:checked') ? null : "Please choose one option."; },
    save(){ D[code]=$('input[name="'+code+'"]:checked').value; D[code+"_order"]=order.map(x=>x.o.v).join(","); }
  });
  return h;
}

/** 0-100 slider; thumb parked at 50 but value unset until touched */
function slider(code, prompt, lo, hi, helper){
  let h = '<div class="blk"><p class="stem" id="lbl-'+code+'">'+esc(prompt)+'</p>';
  if(helper) h += '<p class="helper">'+esc(helper)+'</p>';
  h += '<div class="sldwrap"><input type="range" id="'+code+'" min="0" max="100" step="1" value="50" '+
       'aria-labelledby="lbl-'+code+'" aria-valuetext="Not set">'+
       '<output class="sldval" id="'+code+'-out">\u2014</output></div>'+
       '<div class="sldends"><span>'+esc(lo)+'</span><span>'+esc(hi)+'</span></div></div>';
  BLOCKS.push({
    mount(){
      const el=$('#'+code), out=$('#'+code+'-out');
      const upd=()=>{ el.dataset.touched="1"; out.textContent=el.value;
                      el.setAttribute("aria-valuetext",el.value);
                      el.style.setProperty("--pct",el.value+"%"); };
      el.addEventListener("input",upd); el.addEventListener("change",upd);
    },
    validate(){ return $('#'+code).dataset.touched ? null : "Please move the slider to record an answer."; },
    save(){ D[code]=parseInt($('#'+code).value,10); }
  });
  return h;
}

/** numeric text entry */
function numberQ(code, prompt, prefix, hint, min, max){
  let h = '<div class="blk"><label class="fld" for="'+code+'">'+esc(prompt)+'</label>'+
    '<div class="numwrap">'+(prefix?'<span class="pre">'+esc(prefix)+'</span>':'')+
    '<input type="text" inputmode="numeric" class="num" id="'+code+'" autocomplete="off" aria-describedby="'+code+'-h"></div>'+
    '<p class="hint" id="'+code+'-h">'+esc(hint)+'</p><p class="err" id="'+code+'-e" role="alert"></p></div>';
  BLOCKS.push({
    validate(){
      const raw=$('#'+code).value.trim().replace(/[$,\s]/g,"");
      const n=Number(raw);
      const e=$('#'+code+'-e');
      if(raw==="" || !isFinite(n) || n<min || n>max){
        e.textContent="Please enter a whole number between "+min+" and "+max+".";
        e.style.display="block"; return "__inline__";
      }
      e.style.display="none"; return null;
    },
    save(){ D[code]=Math.round(Number($('#'+code).value.trim().replace(/[$,\s]/g,""))); }
  });
  return h;
}

         '<span class="ico" aria-hidden="true">'+o.icon+'</span>'+
         '<span class="clab">'+esc(o.t)+'</span></label>';
  h += '</div></div>';
  BLOCKS.push({
    validate(){ return $('input[name="'+code+'"]:checked') ? null : "Please choose one option for every question."; },
    save(){ const el=$('input[name="'+code+'"]:checked');
            D[code]=el.value; D[code+"_label"]=options.filter(o=>o.v===el.value)[0].t; }
  });
  return h;

/** the frame-aligned recap shown above every measurement screen */
function recap(){
  const choose = D.cond_act==="choose";
  const act = choose ? 'You chose the '+D.dec_kept_name+'.'
                     : 'You removed the '+D.dec_forgone_name+'.';
  return '<div class="recap" style="display:flex;align-items:flex-start;column-gap:12px">'+
    '<span class="recap-mark '+(choose?'keep':'remove')+'" role="img" aria-label="'+
      (choose?'Kept':'Removed')+'">'+(choose?GLYPH_KEEP:GLYPH_REMOVE)+'</span>'+
    '<span><strong>'+esc(act)+'</strong><br>The '+esc(D.dec_kept_name)+' is in your cart.</span></div>';
}
/* Act-aligned stem for the process measures (researcher request): identical
   syntax in both frames, differing only in the verb and its object. The primary
   DV deliberately keeps a frame-neutral stem so the outcome is not framed. */
function actStem(){ return FRAME[D.cond_act].back(K(), F()); }
function K(){ return D.dec_kept_short; }
function F(){ return D.dec_forgone_short; }

/* ======================================================================== */
/* DECISION SCREEN MECHANICS                                                */
/* ======================================================================== */
function mountDecision(){
  const cmp=$('#cmp'); if(!cmp) return;

  // Gutter rails bridge the rows on which the two models MATCH.
  // offsetTop math (not getBoundingClientRect) so the result is independent of
  // scroll position, and recomputed once fonts/layout settle.
  function drawRails(){
    const rails=$('#rails'); if(!rails) return;
    const leftCard=$('.pcard[data-side="left"]');
    if(!leftCard) return;
    const cardTop=leftCard.offsetTop;
    let html="";
    $$('.specrow', leftCard).forEach((row,i)=>{
      if(S.differs.indexOf(S.rowKeys[i])>=0) return;              // only bridge matched rows
      const top=cardTop+row.offsetTop+row.offsetHeight/2;
      html+='<div class="rail" aria-hidden="true" style="left:calc(50% - 12px);top:'+top+'px"></div>';
    });
    rails.innerHTML=html;
  }
  requestAnimationFrame(drawRails);
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(drawRails);
  setTimeout(drawRails,300);
  addEventListener("resize",drawRails);

  // dwell timing per card
  const dwell={left:0,right:0}; let hoverSide=null, hoverStart=0, switches=0;
  $$('.pcard').forEach(card=>{
    const side=card.dataset.side;
    card.addEventListener("mouseenter",()=>{
      if(hoverSide && hoverSide!==side) switches++;
      hoverSide=side; hoverStart=performance.now();
    });
    card.addEventListener("mouseleave",()=>{
      if(hoverSide===side){ dwell[side]+=performance.now()-hoverStart; hoverSide=null; }
    });
  });

  // buttons enable after the deliberation window
  const btns=$$('.btn-decide');
  const enterMs=performance.now();
  let enabledAt=null;
  const timer=setTimeout(()=>{
    enabledAt=performance.now();
    btns.forEach(b=>{ b.disabled=false; b.setAttribute("aria-disabled","false"); });
  }, CONFIG.decisionDelayMs);

  btns.forEach(btn=>{
    btn.addEventListener("click",()=>{
      if(btn.disabled) return;
      clearTimeout(timer);
      if(hoverSide){ dwell[hoverSide]+=performance.now()-hoverStart; hoverSide=null; }

      const side=btn.dataset.side;
      const clickedIdx = side==="left" ? S.leftIdx : S.rightIdx;
      // CHOOSE: the clicked model is kept. REJECT: the clicked model is removed.
      const keptIdx = D.cond_act==="choose" ? clickedIdx : 1-clickedIdx;
      const keptSide = (keptIdx===S.leftIdx) ? "left" : "right";

      D.dec_kept_idx        = keptIdx;
      D.dec_kept_name       = S.model[keptIdx].name;
      D.dec_kept_short      = S.model[keptIdx].short;
      D.dec_forgone_name    = S.model[1-keptIdx].name;
      D.dec_forgone_short   = S.model[1-keptIdx].short;
      D.dec_clicked_side    = side;
      D.dec_kept_side       = keptSide;
      D.dec_kept_profile    = S.model[keptIdx].profile;   // 0 = Denmark/aluminium, 1 = Japan/composite
      D.dec_time_ms         = enabledAt ? Math.round(performance.now()-enabledAt) : 0;
      D.dec_time_total_ms   = Math.round(performance.now()-enterMs);
      D.dwell_left_ms       = Math.round(dwell.left);
      D.dwell_right_ms      = Math.round(dwell.right);
      D.dwell_kept_ms       = Math.round(keptSide==="left"?dwell.left:dwell.right);
      D.dwell_forgone_ms    = Math.round(keptSide==="left"?dwell.right:dwell.left);
      D.dwell_switches      = switches;

      logEvent("decision",{ cell:D.cond_cell, kept:D.dec_kept_name, prof:D.dec_kept_profile });

      // Reinforce the act: the mark lands on the card the participant ACTED ON
      // (checked when choosing, crossed when rejecting). The forgone card dims in
      // BOTH frames, so the end state is identical and only the mark's target differs.
      btns.forEach(b=>{ b.disabled=true; b.setAttribute("aria-disabled","true"); });
      const clickedCard = $('.pcard[data-side="'+side+'"]');
      const otherCard   = $('.pcard[data-side="'+(side==="left"?"right":"left")+'"]');
      const forgoneCard = D.cond_act==="choose" ? otherCard : clickedCard;
      if(clickedCard) clickedCard.classList.add("acted");
      setTimeout(()=>{ if(forgoneCard) forgoneCard.classList.add("dimmed"); }, 320);
      setTimeout(advance, 1500);
    });
  });
}

/* ======================================================================== */
/* ENGINE                                                                   */
/* ======================================================================== */
const START_MS=Date.now();
let ORDER=[], CURSOR=-1, CURRENT_ID="load", ENTERED=0;

function buildOrder(){
  // fixed spine, with two counterbalanced regions
  const byId={}; PAGES.forEach(p=>byId[p.id]=p);
  const head=["consent","intro","intake","task","labreport","stimulus","outcome","dv","downstream"];
  const medOrder = pick2() ? ["med_quality","med_taste"] : ["med_taste","med_quality"];
  const expOrder = shuf(["exp_a","exp_b","rivals","singles"]);
  const tail=["checks","demographics","summary","debrief"];
  D.cb_med_order = medOrder.join(">");
  D.cb_exp_order = expOrder.join(">");
  ORDER = head.concat(medOrder, expOrder, tail).map(id=>byId[id]);
}
function instrIndex(i){                      // progress counts instrument screens only
  let n=0; for(let k=0;k<=i;k++) if(ORDER[k].fam==="instr") n++;
  return n;
}
function instrTotal(){ return ORDER.filter(p=>p.fam==="instr").length; }

function shellInstr(page, idx){
  const n=instrIndex(idx), tot=instrTotal();
  return '<div class="ibar"><div class="ibar-in">'+
    '<div class="ibrand">Vantrel Consumer Panel</div>'+
    '<div class="prog-wrap"><span class="prog-cap tnum">Page '+n+' of '+tot+'</span>'+
    '<div class="prog" role="progressbar" aria-label="Questionnaire progress" aria-valuemin="0" '+
    'aria-valuemax="'+tot+'" aria-valuenow="'+n+'"><div style="width:'+Math.round(n/tot*100)+'%"></div></div>'+
    '</div></div></div>'+
    '<div class="icard-wrap"><div class="icard" id="card"></div></div>';
}

function advance(){
  const page=ORDER[CURSOR];
  D["t_"+page.id+"_ms"]=(D["t_"+page.id+"_ms"]||0)+Math.round(performance.now()-ENTERED);
  if(CURSOR+1<ORDER.length) showPage(CURSOR+1);
  else finish();
}
async function finish(){
  const ok=await submitData();
  renderComplete(ok);
}

function showPage(i){
  let page=ORDER[i];
  while(page && page.skipIf && page.skipIf()){          // conditional screens
    i++; if(i>=ORDER.length){ finish(); return; }
    page=ORDER[i];
  }
  CURSOR=i; CURRENT_ID=page.id; ENTERED=performance.now();
  resetBlocks();
  const store=$('#store'), instr=$('#instr');

  if(page.fam==="store"){
    instr.style.display="none"; instr.innerHTML="";
    store.style.display="block"; store.className="fade-in";
    page.render(store);
    if(page.cta){                       // store screens that need a plain continue
      const main=$('#main');
      const wrap=document.createElement("div");
      wrap.className="shell";
      wrap.style.cssText="display:flex;justify-content:flex-end;margin-top:28px";
      const b=document.createElement("button");
      b.className="btn-cta"; b.type="button"; b.textContent=page.cta;
      b.addEventListener("click",()=>advance());
      wrap.appendChild(b); main.appendChild(wrap);
    }
  } else {
    store.style.display="none"; store.innerHTML="";
    instr.style.display="block"; instr.className="fade-in";
    instr.innerHTML=shellInstr(page,i);
    const card=$('#card');
    page.render(card);
    BLOCKS.forEach(b=>{ if(b.mount) b.mount(); });

    const div=document.createElement("div"); div.className="idiv"; card.appendChild(div);
    const err=document.createElement("p"); err.className="err"; err.setAttribute("role","alert"); card.appendChild(err);
    const row=document.createElement("div"); row.className="icta-row";
    const btn=document.createElement("button");
    btn.className="btn-cta"; btn.type="button"; btn.textContent=page.cta||"Continue";
    row.appendChild(btn); card.appendChild(row);

    btn.addEventListener("click", async ()=>{
      let msg=null;
      for(const b of BLOCKS){ const m=b.validate?b.validate():null; if(m){ msg=m; break; } }
      if(!msg && page.validate) msg=page.validate();
      if(msg){
        if(msg!=="__inline__"){ err.textContent=msg; err.style.display="block"; }
        else err.style.display="none";
        return;
      }
      err.style.display="none"; btn.disabled=true; btn.textContent="\u2026";
      BLOCKS.forEach(b=>{ if(b.save) b.save(); });
      D["t_"+page.id+"_ms"]=(D["t_"+page.id+"_ms"]||0)+Math.round(performance.now()-ENTERED);
      try{ if(page.onExit) await page.onExit(); }catch(e){ console.error(e); }
      if(CURSOR+1<ORDER.length) showPage(CURSOR+1);
      else await finish();
    });
  }
  const h=document.querySelector("h1"); if(h && h.hasAttribute("tabindex")) h.focus({preventScroll:true});
  scrollTo(0,0);
}

/* ------------------------------- terminal screens ----------------------- */
function terminal(html){
  $('#store').style.display="none"; $('#store').innerHTML="";
  const instr=$('#instr'); instr.style.display="block";
  instr.innerHTML='<div class="ibar"><div class="ibar-in"><div class="ibrand">Vantrel Consumer Panel</div></div></div>'+
    '<div class="icard-wrap"><div class="icard">'+html+'</div></div>';
}
function renderDeviceBlock(){
  logEvent("screenout_device",{ua:navigator.userAgent.slice(0,200),tp:navigator.maxTouchPoints});
  terminal('<h1 tabindex="-1">A desktop or laptop is required</h1><div class="prose" style="margin-top:20px">'+
    '<p>This study can only be completed on a desktop or laptop computer, and it looks like you are on a phone or tablet.</p>'+
    '<p>Please <strong>return your submission</strong> on the recruitment platform \u2014 you will not be penalised and '+
    'no rejection will be issued. You are welcome to start again from a desktop or laptop.</p></div>');
}
function renderAlreadyDone(){
  terminal('<h1 tabindex="-1">Already completed</h1><div class="prose" style="margin-top:20px">'+
    '<p>Our records show this study has already been completed in this browser. If you believe this is an error, '+
    'please contact the researcher through the recruitment platform.</p></div>');
}
function renderComplete(saved){
  const cc=CONFIG.completion;
  let h='<h1 tabindex="-1">Thank you</h1><div class="prose" style="margin-top:20px">'+
        '<p>Your responses have been '+(saved?"recorded":"prepared")+'.</p>';
  if(!saved && !OFFLINE){
    h+='<p style="color:var(--c-error)"><strong>We had trouble reaching our server.</strong> Your completion is still '+
       'valid \u2014 please also copy the text below and send it to the researcher through the platform so no data is lost.</p>'+
       '</div><textarea readonly style="min-height:120px">'+esc(JSON.stringify(D))+'</textarea><div class="prose">';
  }
  if(cc.platform==="prolific"){
    h+='<p>Your completion code is <span class="cc">'+esc(cc.code)+'</span></p>'+
       '<p>You will be redirected to Prolific in a moment. If nothing happens, '+
       '<a href="'+esc(cc.prolificRedirect+cc.code)+'">click here to register your completion</a>.</p>';
    setTimeout(()=>{ location.href=cc.prolificRedirect+cc.code; },4000);
  } else {
    h+='<p>Your completion code is <span class="cc">'+esc(cc.code)+'</span></p>'+
       '<p>Please copy it back into the study page on the platform.</p>';
  }
  h+='</div>';
  terminal(h);
  try{ localStorage.setItem("st_done_"+CONFIG.studyName,"1"); }catch(e){}
}

/* ---------------------------------- boot -------------------------------- */
(function boot(){
  if(OFFLINE){
    const b=document.createElement("div"); b.className="offline";
    b.textContent="OFFLINE PREVIEW \u2014 backend not configured; payloads log to the console only";
    document.body.appendChild(b);
  }
  captureIds(); captureMeta();
  D.ts_start=new Date().toISOString();
  buildOrder();
  if(localStorage.getItem("st_done_"+CONFIG.studyName)){ renderAlreadyDone(); return; }
  if(CONFIG.desktopOnly && isMobile()){ renderDeviceBlock(); return; }
  logEvent("page_enter",{page:"start"});
  showPage(0);
})();
</script>
